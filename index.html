<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>こはなタワー - 聖なる卒業式ver</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Sawarabi Mincho",serif;background:#fdfbf7}
  body{background:linear-gradient(to bottom,#e0f4ff 0%,#fdfbf7 100%)}
  
  #game{position:fixed;inset:0;display:block;width:100%;height:100%}

  #status{position:fixed;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.9);border:1px solid #d4af37;border-radius:22px;padding:8px 14px;display:flex;gap:14px;z-index:10}
  .si{display:flex;gap:6px;align-items:center;font-weight:700;color:#4a4238}
  .si .v{font-size:18px;color:#d4af37}

  #ctrl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
  .btn{width:62px;height:62px;border-radius:50%;border:2px solid #d4af37;background:#fff;font-weight:700;font-size:24px;color:#4a4238;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,0.1);cursor:pointer}
  .btn.drop{width:74px;height:74px;background:linear-gradient(135deg,#d4af37,#aa891d);color:#fff;font-size:14px;border:none}
  .btn:disabled{opacity:.3}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
  .ov.show{display:flex}
  .card{background:#fff;border:2px solid #d4af37;border-radius:28px;padding:30px;max-width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
  .card h1{font-size:28px;margin-bottom:10px;color:#aa891d}
  .card p{font-size:14px;margin-bottom:20px;color:#666}
  .big{padding:12px 30px;border-radius:20px;border:none;background:#d4af37;color:#fff;font-weight:bold;cursor:pointer}
  
  /* クリア報酬画像用 */
  #rewardImg { max-width: 100%; max-height: 250px; display: none; margin: 15px 0; border: 3px double #d4af37; border-radius: 10px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.3.0/build/decomp.min.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="status">
    <div class="si"><span>積んだ数</span><span id="score" class="v">0</span>/20</div>
    <div class="si"><span>最高</span><span id="hiscore" class="v">0</span></div>
  </div>

  <div id="ctrl">
    <button id="left"  class="btn">◀</button>
    <button id="rot"   class="btn">↻</button>
    <button id="drop"  class="btn drop">DROP</button>
    <button id="right" class="btn">▶</button>
  </div>

  <div id="ov" class="ov show">
    <div class="card">
      <h1 id="ovTitle">こはなタワー</h1>
      <p id="ovMsg">20個積み上げたらクリア！<br>聖なる報酬が待っています。</p>
      <img id="rewardImg" src="" alt="報酬画像">
      <button id="ovBtn" class="big">スタート</button>
    </div>
  </div>

<script>
(() => {
  const {Engine, Render, Runner, World, Bodies, Body, Composite, Events, Vertices} = Matter;
  window.decomp = decomp;

  const cfg = {
    w: innerWidth, h: innerHeight,
    maxPieces: 20, // 20個クリアに変更
    baseYRatio: 0.8,
    targetEdge: 100,
    rewardImage: 'images/clear_reward.png' // ★ここにクリア後の画像パスを入れる
  };

  const state = {
    phase: 'READY',
    score: 0,
    hiscore: Number(localStorage.getItem('kohana.hiscore')||0),
    current: null,
    pieces: [],
    imagePool: [], // 偏り防止用のプール
    imagesReady: false,
    spriteMap: new Map()
  };

  const canvas = document.getElementById('game');
  const engine = Engine.create();
  // 物理のガタつきを抑えるための微調整
  engine.velocityIterations = 8;
  engine.positionIterations = 10;

  const render = Render.create({
    canvas, engine,
    options: { width: cfg.w, height: cfg.h, background: 'transparent', wireframes: false }
  });

  /* UI制御 */
  const $ = s => document.querySelector(s);
  const scoreEl=$('#score'), hisEl=$('#hiscore'), ov=$('#ov'), ovTitle=$('#ovTitle'), ovMsg=$('#ovMsg'), ovBtn=$('#ovBtn'), rewardImg=$('#rewardImg');

  const updateScore = () => {
    scoreEl.textContent = state.score;
    if(state.score > state.hiscore) {
      state.hiscore = state.score;
      localStorage.setItem('kohana.hiscore', state.hiscore);
      hisEl.textContent = state.hiscore;
    }
  };

  /* 画像読み込み & 偏り防止のシャッフル */
  async function prepareImages() {
    const found = [];
    for(let i=1; i<=15; i++){
      const url = `images/piece${String(i).padStart(2,'0')}.png`;
      const ok = await new Promise(res => {
        const img = new Image();
        img.onload = () => res(url);
        img.onerror = () => res(null);
        img.src = url;
      });
      if(ok) found.push(ok);
    }
    state.allImages = found;
    fillImagePool();
    state.imagesReady = true;
  }

  function fillImagePool() {
    // 15種類の画像をシャッフルしてプールに入れる（偏り防止）
    state.imagePool = [...state.allImages].sort(() => Math.random() - 0.5);
  }

  function getNextImage() {
    if(state.imagePool.length === 0) fillImagePool();
    return state.imagePool.pop();
  }

  /* 土台作成 */
  const baseW = 200, baseH = 20;
  const base = Bodies.rectangle(cfg.w/2, cfg.h * cfg.baseYRatio, baseW, baseH, {
    isStatic: true, render: { fillStyle: '#8B7355' }, friction: 1
  });
  World.add(engine.world, base);

  /* ピース生成 */
  async function spawnPiece() {
    if(state.phase !== 'AIM' || state.current) return;
    
    const url = getNextImage();
    const img = new Image();
    img.src = url;
    await img.decode();

    const s = cfg.targetEdge / Math.max(img.width, img.height);
    const x = cfg.w/2, y = 100;

    // 物理ボディ作成（簡易化してガタつき防止）
    const body = Bodies.rectangle(x, y, img.width*s, img.height*s, {
      friction: 0.8,
      frictionStatic: 1.5,
      restitution: 0.1,
      density: 0.01,
      isStatic: true,
      label: 'piece',
      render: { visible: false } // 自前描画するのでMatterの描画はオフ
    });

    state.spriteMap.set(body.id, { img, s });
    state.current = body;
    World.add(engine.world, body);
  }

  /* 操作関数 */
  const move = dx => {
    if(!state.current) return;
    const nx = Math.max(50, Math.min(cfg.w - 50, state.current.position.x + dx));
    Body.setPosition(state.current, { x: nx, y: state.current.position.y });
  };
  const rotate = () => {
    if(!state.current) return;
    Body.rotate(state.current, Math.PI/4);
  };
  const drop = () => {
    if(!state.current) return;
    Body.setStatic(state.current, false);
    state.pieces.push(state.current);
    state.current = null;
    state.phase = 'DROP';
  };

  /* 更新ループ */
  Events.on(engine, 'afterUpdate', () => {
    if(state.phase === 'OVER') return;

    // 落下判定
    for(let b of state.pieces) {
      if(b.position.y > cfg.h + 100) {
        gameOver(`${state.score}個で落っこちてしまいました…`);
        return;
      }
    }

    // 静止判定
    if(state.phase === 'DROP') {
      const isStable = state.pieces.every(b => b.speed < 0.2 && b.angularSpeed < 0.02);
      if(isStable) {
        state.score++;
        updateScore();
        if(state.score >= cfg.maxPieces) {
          gameClear();
        } else {
          state.phase = 'AIM';
          spawnPiece();
        }
      }
    }
  });

  /* 自前描画（ Matter.js の標準Renderの上に乗せる ） */
  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    [...state.pieces, state.current].forEach(b => {
      if(!b) return;
      const sprite = state.spriteMap.get(b.id);
      if(!sprite) return;
      ctx.save();
      ctx.translate(b.position.x, b.position.y);
      ctx.rotate(b.angle);
      ctx.drawImage(sprite.img, -sprite.img.width*sprite.s/2, -sprite.img.height*sprite.s/2, sprite.img.width*sprite.s, sprite.img.height*sprite.s);
      ctx.restore();
    });
  });

  function gameClear() {
    state.phase = 'OVER';
    ov.classList.add('show');
    ovTitle.textContent = "祝！タワークリア！";
    ovMsg.textContent = "20個の魂を積み上げました。報酬を授けます。";
    rewardImg.src = cfg.rewardImage;
    rewardImg.style.display = "block";
    ovBtn.textContent = "もう一度遊ぶ";
  }

  function gameOver(msg) {
    state.phase = 'OVER';
    ov.classList.add('show');
    ovTitle.textContent = "ゲームオーバー";
    ovMsg.textContent = msg;
    rewardImg.style.display = "none";
    ovBtn.textContent = "リトライ";
  }

  function reset() {
    state.pieces.forEach(b => World.remove(engine.world, b));
    state.pieces = [];
    state.score = 0;
    state.spriteMap.clear();
    updateScore();
    state.phase = 'AIM';
    spawnPiece();
  }

  /* イベント登録 */
  ovBtn.onclick = async () => {
    ov.classList.remove('show');
    if(!state.imagesReady) await prepareImages();
    if(state.phase === 'OVER') reset();
    else { state.phase = 'AIM'; spawnPiece(); }
  };

  $('#left').onclick = () => move(-30);
  $('#right').onclick = () => move(30);
  $('#rot').onclick = () => rotate();
  $('#drop').onclick = () => drop();

  Render.run(render);
  Runner.run(Runner.create(), engine);
  hisEl.textContent = state.hiscore;
})();
</script>
</body>
</html>
