<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>こはなタワー - 卒業式ver</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Sawarabi Mincho",serif;background:#87CEEB}
  
  /* 復活：青空と雲の背景モーション */
  body{background:linear-gradient(to bottom,#87CEEB 0%,#98D8E8 50%,#B0E0E6 100%)}
  .cloud{position:fixed;background:#fff;border-radius:100px;opacity:.85;filter:drop-shadow(0 4px 10px rgba(0,0,0,.08));z-index:0}
  .cloud::before{content:"";position:absolute;background:#fff;border-radius:100px}
  .c1{width:120px;height:44px;top:14%;animation:flow 22s linear infinite}
  .c1::before{width:60px;height:60px;left:14px;top:-26px}
  .c2{width:92px;height:38px;top:36%;animation:flow 27s linear infinite .6s}
  .c2::before{width:68px;height:42px;right:18px;top:-20px}
  @keyframes flow{0%{left:-140px}100%{left:110%}}

  #game{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:1}

  #status{position:fixed;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(255,255,255,.95);border:2px solid #d4af37;border-radius:22px;padding:8px 14px;display:flex;gap:14px;align-items:center;z-index:10}
  .si{display:flex;gap:6px;align-items:center;font-weight:700;color:#333}
  .si .v{font-size:18px;color:#d4af37}

  #ctrl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px;z-index:10}
  .btn{width:62px;height:62px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.92);font-weight:700;font-size:24px;color:#333;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.12);cursor:pointer;touch-action:manipulation}
  .btn:disabled{opacity:.4}
  .btn:active{transform:scale(.96)}
  .btn.drop{width:74px;height:74px;background:linear-gradient(135deg,#FFD93D 0%,#FFB84D 100%);border-color:#FFB84D;color:#fff;font-size:14px}

  .ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(4px)}
  .ov.show{display:flex}
  .card{background:#fff;border:2px solid #d4af37;border-radius:28px;padding:32px 24px;max-width:min(480px,90%);text-align:center;box-shadow:0 18px 36px rgba(0,0,0,.28)}
  .card h1{font-size:30px;margin-bottom:8px;color:#aa891d}
  .card p{font-size:15px;color:#666;margin-bottom:20px}
  .big{padding:14px 32px;border-radius:22px;border:none;background:linear-gradient(135deg,#d4af37,#aa891d);color:#fff;font-weight:800;font-size:18px;cursor:pointer}
  
  #rewardImg { max-width: 100%; max-height: 250px; display: none; margin: 15px auto; border: 3px double #d4af37; border-radius: 10px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.3.0/build/decomp.min.js"></script>
</head>
<body>
  <div class="cloud c1"></div><div class="cloud c2"></div>

  <div id="status">
    <div class="si"><span>積んだ数</span><span id="score" class="v">0</span>/20</div>
    <div class="si"><span>最高</span><span id="hiscore" class="v">0</span></div>
  </div>

  <div id="ctrl">
    <button id="left"  class="btn">◀</button>
    <button id="rot"   class="btn">↻</button>
    <button id="drop"  class="btn drop">DROP</button>
    <button id="right" class="btn">▶</button>
  </div>

  <canvas id="game"></canvas>

  <div id="ov" class="ov show">
    <div class="card">
      <h1 id="ovTitle">こはなタワー</h1>
      <p id="ovMsg">土台に20個積めたらクリア！<br>場外に落ちたらゲームオーバー。</p>
      <img id="rewardImg" src="" alt="聖なる報酬">
      <button id="ovBtn" class="big">スタート</button>
    </div>
  </div>

<script>
(() => {
  const {Engine, Render, Runner, World, Bodies, Body, Composite, Events, Svg, Vertices} = Matter;
  window.decomp = decomp;

  const cfg = {
    w: innerWidth, h: innerHeight,
    maxPieces: 20, 
    baseYRatio: 0.75,
    targetEdge: 130, // オブジェクトの大きさを少し大きく修正
    rewardImage: 'images/clear_reward.png' 
  };

  const state = {
    phase: 'READY',
    score: 0,
    hiscore: Number(localStorage.getItem('kohana.hiscore')||0),
    current: null,
    pieces: [],
    imagePool: [],
    imagesReady: false,
    spriteMap: new Map()
  };

  const canvas = document.getElementById('game');
  const engine = Engine.create();
  engine.velocityIterations = 10; // 物理の精度を上げ、ガタつきを抑制
  engine.positionIterations = 12;

  const render = Render.create({
    canvas, engine,
    options: { width: cfg.w, height: cfg.h, background: 'transparent', wireframes: false }
  });

  const $ = s => document.querySelector(s);
  const scoreEl=$('#score'), hisEl=$('#hiscore'), ov=$('#ov'), ovTitle=$('#ovTitle'), ovMsg=$('#ovMsg'), ovBtn=$('#ovBtn'), rewardImg=$('#rewardImg');

  const updateScore = () => {
    scoreEl.textContent = state.score;
    if(state.score > state.hiscore) {
      state.hiscore = state.score;
      localStorage.setItem('kohana.hiscore', state.hiscore);
      hisEl.textContent = state.hiscore;
    }
  };

  async function prepareImages() {
    const found = [];
    for(let i=1; i<=15; i++){
      const url = `images/piece${String(i).padStart(2,'0')}.png`;
      const ok = await new Promise(res => {
        const img = new Image();
        img.onload = () => res(url);
        img.onerror = () => res(null);
        img.src = url;
      });
      if(ok) found.push(ok);
    }
    state.allImages = found;
    fillImagePool();
    state.imagesReady = true;
  }

  function fillImagePool() {
    state.imagePool = [...state.allImages].sort(() => Math.random() - 0.5);
  }

  function getNextImage() {
    if(state.imagePool.length === 0) fillImagePool();
    return state.imagePool.pop();
  }

  // 精密な当たり判定（画像を解析して頂点データを作る）
  async function createPieceBody(url, x, y) {
    const img = new Image();
    img.src = url;
    await img.decode();

    const tempCanvas = document.createElement('canvas');
    const tCtx = tempCanvas.getContext('2d');
    tempCanvas.width = img.width;
    tempCanvas.height = img.height;
    tCtx.drawImage(img, 0, 0);
    const imageData = tCtx.getImageData(0, 0, img.width, img.height);
    
    // 画像からアルファ値に基づいたポイントを抽出
    const points = [];
    const step = 2; // 精度
    for (let row = 0; row < img.height; row += step) {
      for (let col = 0; col < img.width; col += step) {
        if (imageData.data[(row * img.width + col) * 4 + 3] > 10) {
          points.push({ x: col, y: row });
        }
      }
    }

    // 凸包（Hull）を生成して形をぴっちりさせる
    const hull = Vertices.hull(points);
    const s = cfg.targetEdge / Math.max(img.width, img.height);
    const scaledHull = Vertices.scale(hull, s, s);

    const body = Bodies.fromVertices(x, y, [scaledHull], {
      friction: 0.8,
      frictionStatic: 1.2,
      restitution: 0.05,
      density: 0.005,
      isStatic: true,
      render: { visible: false }
    }, true);

    // 失敗時のフォールバック（四角）
    if (!body) return Bodies.rectangle(x, y, img.width*s, img.height*s, { isStatic:true });

    state.spriteMap.set(body.id, { img, s });
    return body;
  }

  const baseW = 240, baseH = 22, baseY = cfg.h * cfg.baseYRatio;
  const base = Bodies.rectangle(cfg.w/2, baseY, baseW, baseH, {
    isStatic: true, render: { fillStyle: '#8B7355' }, friction: 1, label: 'base'
  });
  World.add(engine.world, base);

  async function spawnPiece() {
    if(state.phase !== 'AIM' || state.current) return;
    const url = getNextImage();
    const x = cfg.w/2, y = 100;
    const body = await createPieceBody(url, x, y);
    state.current = body;
    World.add(engine.world, body);
  }

  const move = dx => {
    if(!state.current) return;
    const nx = Math.max(40, Math.min(cfg.w - 40, state.current.position.x + dx));
    Body.setPosition(state.current, { x: nx, y: state.current.position.y });
  };
  const rotate = () => {
    if(!state.current) return;
    Body.rotate(state.current, Math.PI/4);
  };
  const drop = () => {
    if(!state.current) return;
    Body.setStatic(state.current, false);
    state.pieces.push(state.current);
    state.current = null;
    state.phase = 'DROP';
  };

  Events.on(engine, 'afterUpdate', () => {
    if(state.phase === 'OVER') return;

    for(let b of state.pieces) {
      if(b.position.y > cfg.h + 100) {
        gameOver(`${state.score}個で落下しました…`);
        return;
      }
    }

    if(state.phase === 'DROP') {
      const isStable = state.pieces.every(b => b.speed < 0.3 && b.angularSpeed < 0.03);
      if(isStable) {
        state.score++;
        updateScore();
        if(state.score >= cfg.maxPieces) gameClear();
        else { state.phase = 'AIM'; spawnPiece(); }
      }
    }
  });

  Events.on(render, 'afterRender', () => {
    const ctx = render.context;
    [...state.pieces, state.current].forEach(b => {
      if(!b) return;
      const sprite = state.spriteMap.get(b.id);
      if(!sprite) return;
      ctx.save();
      ctx.translate(b.position.x, b.position.y);
      ctx.rotate(b.angle);
      ctx.drawImage(sprite.img, -sprite.img.width*sprite.s/2, -sprite.img.height*sprite.s/2, sprite.img.width*sprite.s, sprite.img.height*sprite.s);
      ctx.restore();
    });
  });

  function gameClear() {
    state.phase = 'OVER';
    ov.classList.add('show');
    ovTitle.textContent = "✧ 祝・タワークリア ✧";
    ovMsg.textContent = "20個の神殿を見事に守り抜きました。";
    rewardImg.src = cfg.rewardImage;
    rewardImg.style.display = "block";
    ovBtn.textContent = "神殿へ戻る";
  }

  function gameOver(msg) {
    state.phase = 'OVER';
    ov.classList.add('show');
    ovTitle.textContent = "崩壊...";
    ovMsg.textContent = msg;
    rewardImg.style.display = "none";
    ovBtn.textContent = "再び挑む";
  }

  function reset() {
    state.pieces.forEach(b => World.remove(engine.world, b));
    state.pieces = [];
    state.score = 0;
    state.spriteMap.clear();
    updateScore();
    state.phase = 'AIM';
    spawnPiece();
  }

  ovBtn.onclick = async () => {
    ov.classList.remove('show');
    if(!state.imagesReady) await prepareImages();
    if(state.phase === 'OVER') reset();
    else { state.phase = 'AIM'; spawnPiece(); }
  };

  $('#left').onclick = () => move(-30);
  $('#right').onclick = () => move(30);
  $('#rot').onclick = () => rotate();
  $('#drop').onclick = () => drop();

  Render.run(render);
  Runner.run(Runner.create(), engine);
})();
</script>
</body>
</html>
